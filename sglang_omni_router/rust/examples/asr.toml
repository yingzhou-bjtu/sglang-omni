# Two replicas serving transcription and translation.
schema_version = 1

[server]
listen = "127.0.0.1:30000"
max_connections = 1024

[shutdown]
drain_timeout_ms = 30000

[logging]
format = "json"
filter = "info"

[router]
strategy = "round_robin"
max_concurrent_classifications = 4

[admission]
global = 64
transcription_http = 32

[health]
interval_ms = 5000
timeout_ms = 1000
success_threshold = 2
failure_threshold = 3
max_concurrent_probes = 16

[http_media]
routes = ["transcription", "translation"]
trust_domain = "local"
buffered_request_max_bytes = 8388608
buffered_request_total_bytes = 268435456
streamed_request_max_bytes = 536870912
connect_timeout_ms = 5000
request_timeout_ms = 1800000
pool_idle_timeout_ms = 90000
pool_max_idle_per_host = 8

[[workers]]
worker_id = "asr-1"
base_url = "http://127.0.0.1:8200/"
trust_domain = "local"
default_model_id = "asr-model"
health_path = "/health"

[workers.capacity]
transcription_http = 8

[[workers.service_profiles]]
service = "transcription_http"
model_ids = ["asr-model"]
task = "transcribe"
response_formats = ["json", "text", "verbose_json", "srt", "vtt", "sse"]
media_profiles = ["audio"]
stream_modes = ["non_streaming", "streaming"]

[[workers.service_profiles]]
service = "transcription_http"
model_ids = ["asr-model"]
task = "translate"
response_formats = ["json", "text", "verbose_json", "sse"]
media_profiles = ["audio"]
stream_modes = ["non_streaming", "streaming"]

[[workers]]
worker_id = "asr-2"
base_url = "http://127.0.0.1:8201/"
trust_domain = "local"
default_model_id = "asr-model"
health_path = "/health"

[workers.capacity]
transcription_http = 8

[[workers.service_profiles]]
service = "transcription_http"
model_ids = ["asr-model"]
task = "transcribe"
response_formats = ["json", "text", "verbose_json", "srt", "vtt", "sse"]
media_profiles = ["audio"]
stream_modes = ["non_streaming", "streaming"]

[[workers.service_profiles]]
service = "transcription_http"
model_ids = ["asr-model"]
task = "translate"
response_formats = ["json", "text", "verbose_json", "sse"]
media_profiles = ["audio"]
stream_modes = ["non_streaming", "streaming"]
